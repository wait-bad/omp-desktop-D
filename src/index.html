<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OMP Desktop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />


  <!-- Design tokens — copied into src/design/ -->
  <link rel="stylesheet" href="design/styles.css" />
  <link rel="stylesheet" href="design/layout.css" />
  <link rel="stylesheet" href="platform.css" />

  <!-- Syntax highlighting theme (atom-one-dark) -->
  <link rel="stylesheet" href="highlight-theme.css" />
</head>
<body>
  <!-- Instant Video Splash Screen Layer (Paints immediately, before React/Babel loads) -->
  <div id="splash-layer" style="
    position: fixed;
    inset: 0;
    z-index: 999999;
    background: #0d0f12 radial-gradient(circle at center, #1a1e24 0%, #0d0f12 75%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  ">
    <video
      id="splash-video"
      src="splash.mp4"
      autoplay
      playsinline
      preload="auto"
      style="
        height: 100%;
        object-fit: cover;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      "
    ></video>
    <div id="splash-skip-hint" style="
      position: absolute;
      bottom: 24px;
      right: 28px;
      padding: 6px 14px;
      background: rgba(13, 15, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255, 255, 255, 0.8);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      letter-spacing: 0.5px;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    ">
      <span id="splash-skip-text">按任意键跳过</span>
      <span style="
        display: inline-block;
        padding: 1px 5px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        font-size: 10px;
        font-family: monospace;
      ">SPACE</span>
    </div>
  </div>

  <script>
    (function () {
      const splash = document.getElementById("splash-layer");
      const video = document.getElementById("splash-video");
      if (!splash || !video) return;

      // ── 1. Check user preferences: Splash enabled? Audio enabled? Custom video? ───────
      let tweaks = {};
      try {
        tweaks = JSON.parse(localStorage.getItem("omp-desktop:tweaks") || "{}");
      } catch (_) {}

      // If user disabled splash screen completely in Settings
      if (tweaks.splashEnabled === false) {
        splash.remove();
        return;
      }

      // Audio preference: enabled by default unless explicitly disabled
      const enableAudio = tweaks.splashAudio !== false;
      video.muted = !enableAudio;

      function tryPlay() {
        const p = video.play();
        if (p && typeof p.catch === "function") {
          p.catch(function (err) {
            console.warn("[splash] Autoplay with sound failed, fallback to muted:", err);
            video.muted = true;
            video.play().catch(function () {});
          });
        }
      }

      // If user uploaded a custom splash video into IndexedDB
      if (tweaks.splashCustomVideo) {
        try {
          const idbReq = indexedDB.open("omp-desktop-media", 1);
          idbReq.onsuccess = function (e) {
            const db = e.target.result;
            if (db.objectStoreNames.contains("assets")) {
              const getReq = db.transaction("assets", "readonly").objectStore("assets").get("splashVideo");
              getReq.onsuccess = function () {
                if (getReq.result && typeof getReq.result === "string") {
                  video.src = getReq.result;
                  video.muted = !enableAudio;
                  tryPlay();
                }
              };
            }
          };
        } catch (_) {}
      }

      let isDismissed = false;

      function dismissSplash() {
        if (isDismissed) return;
        isDismissed = true;

        // Smoothly fade out audio volume
        try {
          let vol = video.volume;
          const fadeTimer = setInterval(function () {
            vol = Math.max(0, vol - 0.25);
            video.volume = vol;
            if (vol <= 0.05) {
              video.volume = 0;
              clearInterval(fadeTimer);
            }
          }, 35);
        } catch (_) {}

        splash.style.opacity = "0";
        splash.style.transform = "scale(1.015)";
        splash.style.pointerEvents = "none";
        setTimeout(function () {
          try {
            video.pause();
            video.src = "";
            splash.remove();
          } catch (_) {}
        }, 450);
      }

      window.__OMP_SPLASH_DISMISS__ = dismissSplash;

      // Smoothly show video once first frame is ready
      video.addEventListener("playing", function () {
        video.style.opacity = "1";
      });
      video.addEventListener("canplay", function () {
        tryPlay();
        video.style.opacity = "1";
      });

      // ── Guaranteed Exit Points (Instant skip, natural end, never stuck) ──
      // 1. Natural end: when video finishes playing (4s)
      video.addEventListener("ended", dismissSplash);

      // 2. User skip: press ANY key (Space, Enter, Esc, etc.) or click anywhere
      window.addEventListener("keydown", dismissSplash, { once: true });
      splash.addEventListener("click", dismissSplash, { once: true });

      // 3. Error fallback: if video fails to load, dismiss immediately
      video.addEventListener("error", dismissSplash);

      // 4. Absolute Failsafe: 4.6s max timeout (video duration ~4s)
      setTimeout(dismissSplash, 4600);
    })();
  </script>

  <div id="root"></div>

  <!-- React 18 — served locally, precompiled, no CDN and NO Babel dependency -->
  <script src="react.development.js"></script>
  <script src="react-dom.development.js"></script>
  <!-- Markdown + syntax highlighting — must load before design components -->
  <script src="marked.min.js"></script>
  <script src="highlight.min.js"></script>
  <script>
    // Wire marked v12 to use highlight.js for code blocks.
    // Runs after DOMContentLoaded so both libs are parsed.
    (function () {
      if (!window.marked || !window.hljs) return;
      window.marked.use({
        renderer: {
          code(text, lang) {
            const code     = text ?? '';
            const language = (lang ?? '').split(/\s/)[0];
            let highlighted;
            try {
              highlighted = language && hljs.getLanguage(language)
                ? hljs.highlight(code, { language }).value
                : hljs.highlightAuto(code).value;
            } catch (_) {
              highlighted = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            }
            const cls = language ? ' language-' + language : '';
            return '<pre class="code-block"><code class="hljs' + cls + '">' +
                   highlighted + '</code></pre>';
          }
        }
      });
    })();
  </script>

  <!-- Design components (unchanged — from src/design/ copy) -->
  <script src="design/tweaks/style.js"></script>
  <script src="design/tweaks/use-tweaks.js"></script>
  <script src="design/media-db.js"></script>
  <script src="design/tweaks/panel.js"></script>
  <script src="design/tweaks/controls.js"></script>
  <script src="design/ui/icons.js"></script>
  <script src="design/ui/sparks.js"></script>
  <script src="design/ui/markdown.js"></script>
  <script src="design/ui/plan-annotations.js"></script>
  <script src="design/chat/user-bubble.js"></script>
  <script src="design/chat/eval-cell.js"></script>
  <script src="design/chat/assistant-bubble.js"></script>
  <script src="design/chat/tool-card.js"></script>
  <script src="design/chat/ask-bubble.js"></script>
  <script src="design/chat/chat-view.js"></script>
  <script src="design/composer.js"></script>
  <script src="design/chrome.js"></script>
  <script src="design/panels.js"></script>
  <script src="design/settings/models-modal.js"></script>
  <script src="design/settings/history-modal.js"></script>

  <!-- Live data layer (must load before app-live.jsx) -->
  <script src="model-names.js"></script>
  <script src="adapter.js"></script>
  <script src="live.js"></script>

  <!-- App root — wired to OMP_BRIDGE, no demo effects -->
  <!-- App constants + cross-cutting hooks (must load before app-live.jsx) -->
  <script src="app/constants.js"></script>
  <script src="app/use-bridge-snapshot.js"></script>

  <script src="app-live.js"></script>
</body>
</html>
